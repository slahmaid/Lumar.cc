name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site files
        run: |
          set -euo pipefail
          mkdir -p _site/fr _site/ar
          cp index.html main.js styles.css .nojekyll _site/
          cp fr/index.html _site/fr/index.html
          cp ar/index.html _site/ar/index.html
          cp -R brand ScrollSmoother _site/

          # Fail fast if locales or assets are missing
          test -f _site/index.html
          test -f _site/fr/index.html
          test -f _site/ar/index.html
          test -f _site/main.js
          test -f _site/styles.css
          test -d _site/brand
          test -d _site/ScrollSmoother
          echo "Site bundle ready:"
          find _site -type f | sort | head -n 50

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
